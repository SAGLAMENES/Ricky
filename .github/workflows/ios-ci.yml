name: iOS CI/CD (Build, Test, TestFlight)

on:
  push:
    branches: ["feature/analytics"]
  pull_request:
    branches: ["feature/analytics"]
  workflow_dispatch:

jobs:
  build_test_archive:   
    runs-on: macos-15
    env:
      XCODE_SCHEME: RickyApp
      XCODE_WORKSPACE: Ricky.xcworkspace  
      XCODE_PROJECT: RickyApp.xcodeproj
      CONFIGURATION: Release
      ARCHIVE_PATH: ${{ github.workspace }}/build/RickyApp.xcarchive
      EXPORT_PATH:  ${{ github.workspace }}/build/export
      IPA_PATH:     ${{ github.workspace }}/build/export/RickyApp.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Import signing certs
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Install provisioning profile
        run: |
          PP="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP"
          echo "${{ secrets.MOBILEPROVISION }}" | base64 --decode > "$PP/appstore.mobileprovision"

      - name: Create GoogleService-Info.plist
        run: |
          cat > RickyApp/RickyApp/GoogleService-Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>${{ secrets.FIREBASE_API_KEY }}</string>
            <key>GCM_SENDER_ID</key>
            <string>${{ secrets.FIREBASE_GCM_SENDER_ID }}</string>
            <key>GOOGLE_APP_ID</key>
            <string>${{ secrets.FIREBASE_APP_ID }}</string>
            <key>PROJECT_ID</key>
            <string>${{ secrets.FIREBASE_PROJECT_ID }}</string>
            <key>BUNDLE_ID</key>
            <string>com.burakarslan.RickyApp</string>
          </dict>
          </plist>
          EOF

      - name: Resolve SPM
        run: |
          if [ -n "${XCODE_WORKSPACE}" ]; then
            xcodebuild -list -workspace "$XCODE_WORKSPACE"
            xcodebuild -resolvePackageDependencies -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME"
          else
            xcodebuild -list -project "$XCODE_PROJECT"
            xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          fi

      - name: Run SPM Package Tests
        run: |
          # Test all packages
          for package in RickyDomain RickyData RickyRouter; do
            echo "🧪 Testing $package..."
            cd $package
            swift test || echo "⚠️ $package tests failed"
            cd ..
          done
        shell: bash
        continue-on-error: true

      - name: Archive
        run: |
          set -eo pipefail
          if [ -n "${XCODE_WORKSPACE}" ]; then
            xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration "$CONFIGURATION" -archivePath "$ARCHIVE_PATH" clean archive
          else
            xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration "$CONFIGURATION" -archivePath "$ARCHIVE_PATH" clean archive
          fi
        shell: bash

      - name: Export IPA (App Store)
        run: |
          mkdir -p "$EXPORT_PATH"
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key><string>app-store</string>
              <key>signingStyle</key><string>automatic</string>
              <key>stripSwiftSymbols</key><true/>
              <key>uploadSymbols</key><true/>
            </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportOptionsPlist ExportOptions.plist -exportPath "$EXPORT_PATH"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v2
        with:
          app-type: ios
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-private-key-base64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ipa-path: ${{ env.IPA_PATH }}

      - name: Keep IPA (optional)
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: ${{ env.IPA_PATH }}

