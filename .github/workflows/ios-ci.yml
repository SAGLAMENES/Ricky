name: iOS CI - Tests Only

on:
  push:
    branches: ["feature/analytics"]
  pull_request:
    branches: ["feature/analytics"]
  workflow_dispatch:

jobs:
  test_only:
    runs-on: macos-15
    env:
      XCODE_SCHEME: RickyApp
      XCODE_WORKSPACE: Ricky.xcworkspace
      CONFIGURATION: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: List schemes / resolve packages
        run: |
          xcodebuild -list -workspace "$XCODE_WORKSPACE"
          xcodebuild -resolvePackageDependencies -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME"

      # SPM paket testleri: test yoksa build'e düşer, böylece exit 1 vermez
      - name: Run SPM Package Tests (skip if none)
        run: |
          set -e
          for pkg in RickyDomain RickyData RickyRouter; do
            echo "🧪 $pkg"
            cd "$pkg"
            if [ -d "Tests" ] && find Tests -name '*Tests.swift' -print -quit | grep -q .; then
              echo "→ Tests found, running swift test"
              swift test --parallel
            else
              echo "→ No tests found, running swift build instead"
              swift build
            fi
            cd - >/dev/null
          done

      # Uygulamayı simülatörde derle (imzasız). Test target'ın yoksa da sorun çıkmaz.
      - name: Xcode Build (Simulator, no signing)
        run: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build
