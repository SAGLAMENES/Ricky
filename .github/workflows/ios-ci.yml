name: iOS CI - Tests Only

on:
  push:
    branches: ["feature/analytics"]
  pull_request:
    branches: ["feature/analytics"]
  workflow_dispatch:

jobs:
  test_only:
    runs-on: macos-15
    env:
      XCODE_SCHEME: RickyApp
      XCODE_WORKSPACE: Ricky.xcworkspace
      CONFIGURATION: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: List schemes / resolve packages
        run: |
          xcodebuild -list -workspace "$XCODE_WORKSPACE"
          xcodebuild -resolvePackageDependencies -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME"

      # SPM testleri: test yoksa veya "no tests found" hatasında build'e düş
      - name: Run SPM Package Tests with fallback
        run: |
          set -e
          for pkg in RickyDomain RickyData RickyRouter; do
            echo "🧪 $pkg"
            cd "$pkg"

            if [ -d "Tests" ]; then
              set +e
              OUT=$(swift test --parallel 2>&1)
              STATUS=$?
              echo "$OUT"
              set -e

              if [ $STATUS -ne 0 ]; then
                if echo "$OUT" | grep -qi "no tests found"; then
                  echo "→ No tests discovered, falling back to swift build"
                  swift build
                else
                  echo "❌ Tests failed (not a 'no tests found' case)"; exit 1
                fi
              else
                echo "✅ Tests passed in $pkg"
              fi
            else
              echo "→ No Tests directory, running swift build"
              swift build
            fi

            cd - >/dev/null
          done

      # 🔧 Dummy Firebase plist: Copy Bundle Resources bu yolu bekliyor
      - name: Create dummy GoogleService-Info.plist for CI
        run: |
          mkdir -p RickyApp/RickyApp
          cat > RickyApp/RickyApp/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>DUMMY_API_KEY</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:deadbeefdeadbeef</string>
            <key>PROJECT_ID</key><string>dummy-project</string>
            <key>BUNDLE_ID</key><string>com.example.RickyApp</string>
          </dict>
          </plist>
          PLIST

      # Uygulamayı simülatörde derle (imzasız)
      - name: Xcode Build (Simulator, no signing)
        run: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build
