name: iOS CI - Tests Only

on:
  push:
    branches: ["feature/analytics"]
  pull_request:
    branches: ["feature/analytics"]
  workflow_dispatch:

jobs:
  test_only:
    runs-on: macos-15
    env:
      XCODE_SCHEME: RickyApp
      XCODE_WORKSPACE: Ricky.xcworkspace
      CONFIGURATION: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: List schemes / resolve packages
        run: |
          xcodebuild -list -workspace "$XCODE_WORKSPACE"
          xcodebuild -resolvePackageDependencies -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME"

      # SPM testleri: test yoksa VEYA "no tests found" hatası gelirse swift build'e düş
      - name: Run SPM Package Tests with fallback
        run: |
          set -e
          for pkg in RickyDomain RickyData RickyRouter; do
            echo "🧪 $pkg"
            cd "$pkg"

            if [ -d "Tests" ]; then
              set +e
              OUT=$(swift test --parallel 2>&1)
              STATUS=$?
              echo "$OUT"
              set -e

              if [ $STATUS -ne 0 ]; then
                if echo "$OUT" | grep -qi "no tests found"; then
                  echo "→ No tests discovered, falling back to swift build"
                  swift build
                else
                  echo "❌ Tests failed (not a 'no tests found' case)"; exit 1
                fi
              else
                echo "✅ Tests passed in $pkg"
              fi
            else
              echo "→ No Tests directory, running swift build"
              swift build
            fi

            cd - >/dev/null
          done

      # Uygulamayı simülatörde sadece derle (imzasız). Test target yoksa da sorun çıkmaz.
      - name: Xcode Build (Simulator, no signing)
        run: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build
