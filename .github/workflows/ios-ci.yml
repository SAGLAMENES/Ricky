name: iOS CI - Tests Only

on:
  push:
    branches: ["feature/analytics"]
  pull_request:
    branches: ["feature/analytics"]
  workflow_dispatch:

jobs:
  test_only:
    runs-on: macos-15
    env:
      XCODE_SCHEME: RickyApp
      XCODE_WORKSPACE: Ricky.xcworkspace
      CONFIGURATION: Debug

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Resolve SPM
        run: |
          xcodebuild -resolvePackageDependencies -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME"

      # SPM paket testleri (pakette test yoksa build'e düşer)
      - name: Run SPM Package Tests
        run: |
          set -e
          for pkg in RickyDomain RickyData RickyRouter; do
            echo "🧪 $pkg"
            if [ -d "$pkg/Tests" ] && find "$pkg/Tests" -name '*Tests.swift' | grep -q .; then
              (cd "$pkg" && swift test --parallel)
            else
              echo "⚠️ No tests in $pkg → swift build"
              (cd "$pkg" && swift build)
            fi
          done

      # Xcode test (varsa). Yoksa en azından app'i simülatörde derle.
      - name: Xcode Unit/UI Tests (Simulator)
        run: |
          set -e
          # Simülatörde test için imza gerekmez
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            CODE_SIGNING_ALLOWED=NO \
            test
